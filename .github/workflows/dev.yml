name: dev
on:
  push:
    branches-ignore:
      - main
jobs:
  check-changes:
    runs-on: ubuntu-24.04
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}
      compute: ${{ steps.filter.outputs.compute }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            webapp:
              - 'webapp/**'
            compute:
              - 'compute/**'
  lint-py:
    needs: [check-changes]
    if: needs.check-changes.outputs.compute == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/lint-py
  lint-js:
    needs: [check-changes]
    if: needs.check-changes.outputs.webapp == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/lint-js
