name: stg
on:
  push:
    branches:
      - main
jobs:
  check-changes:
    runs-on: ubuntu-24.04
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            webapp:
              - 'webapp/**'
            worker:
              - 'worker/**'
  lint-py:
    needs: [check-changes]
    if: needs.check-changes.outputs.worker == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint-py
  lint-js:
    needs: [check-changes]
    if: needs.check-changes.outputs.webapp == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint-js
  build-worker:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [lint-py]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          env: stg
          name: worker
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  build-webapp:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [lint-js]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          env: stg
          name: webapp
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  deploy-worker:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vm
        with:
          env: stg
          tag: keep
          name: worker
          image_name: worker
          zone: us-central1-a
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  deploy-webapp:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build-webapp]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-cloudrun
        with:
          env: stg
          name: webapp
          image_name: webapp
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
