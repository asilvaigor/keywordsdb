name: prd
on:
  push:
    tags:
      - '*'
jobs:
  lint-py:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint-py
  lint-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint-js
  build-compute:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [lint-py]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          env: prd
          tag: keep
          name: compute
          image_name: workers
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  build-webapp:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [lint-js]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/build
        with:
          env: prd
          name: webapp
          image_name: webapp
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  deploy-webapp:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build-webapp]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-cloudrun
        with:
          env: prd
          name: webapp
          image_name: webapp
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          secrets: "\
            CLICKHOUSE_URL='${{ vars.CLICKHOUSE_URL }}',\
            CLICKHOUSE_USERNAME='${{ vars.CLICKHOUSE_USERNAME }}',\
            CLICKHOUSE_PASSWORD='${{ secrets.CLICKHOUSE_PASSWORD }}',\
            GCS_ACCESS_KEY_ID='${{ secrets.GCS_ACCESS_KEY_ID }}',\
            GCS_SECRET_ACCESS_KEY='${{ secrets.GCS_SECRET_ACCESS_KEY }}',\
            BETTER_AUTH_RESEND_KEY='${{ secrets.BETTER_AUTH_RESEND_KEY }}',\
            BETTER_AUTH_SECRET='${{ secrets.BETTER_AUTH_SECRET }}',\
            BETTER_AUTH_GOOGLE_ID='${{ secrets.BETTER_AUTH_GOOGLE_ID }}',\
            BETTER_AUTH_GOOGLE_SECRET='${{ secrets.BETTER_AUTH_GOOGLE_SECRET }}',\
            BETTER_AUTH_URL='${{ vars.BETTER_AUTH_URL_PRD }}',\
            STRIPE_CHECKOUT_ACTIVATED='true',\
            STRIPE_SECRET_KEY='${{ secrets.STRIPE_SECRET_KEY_PRD }}',\
            STRIPE_WEBHOOK_SECRET='${{ secrets.STRIPE_WEBHOOK_SECRET_PRD }}'"
