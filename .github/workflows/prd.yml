name: prd
on:
  push:
    tags:
      - "*"
jobs:
  lint-py:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint-py
  lint-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint-js
  build-workers:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [lint-py]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          env: prd
          name: workers
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  build-webapp:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [lint-js]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          env: prd
          name: webapp
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  deploy-workers:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build-workers]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vm
        with:
          env: prd
          name: worker-ingestion
          image_name: workers
          zone: us-central1-a
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  deploy-webapp:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build-webapp]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-cloudrun
        with:
          env: prd
          name: webapp
          image_name: webapp
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          secrets: "\
            CLICKHOUSE_URL='${{ vars.CLICKHOUSE_URL }}',\
            CLICKHOUSE_USERNAME='${{ vars.CLICKHOUSE_USERNAME }}',\
            CLICKHOUSE_PASSWORD='${{ secrets.CLICKHOUSE_PASSWORD }}'"
