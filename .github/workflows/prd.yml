name: prd
on:
  push:
    branches:
      - main
jobs:
  check-changes:
    runs-on: ubuntu-24.04
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}
      workers: ${{ steps.filter.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            webapp:
              - 'webapp/**'
            workers:
              - 'workers/**'
  lint-py:
    needs: [check-changes]
    if: needs.check-changes.outputs.workers == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint-py
  lint-js:
    needs: [check-changes]
    if: needs.check-changes.outputs.webapp == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint-js
  build-workers:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [lint-py]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          env: prd
          tag: keep
          name: workers
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  build-webapp:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [lint-js]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          env: prd
          name: webapp
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  deploy-workers:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build-workers]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vm
        with:
          env: prd
          tag: keep
          name: worker-ingestion
          image_name: workers
          zone: us-central1-a
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  deploy-webapp:
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build-webapp]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-cloudrun
        with:
          env: prd
          name: webapp
          image_name: webapp
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          secrets: "\
            CLICKHOUSE_URL='${{ vars.CLICKHOUSE_URL }}',\
            CLICKHOUSE_USERNAME='${{ vars.CLICKHOUSE_USERNAME }}',\
            CLICKHOUSE_PASSWORD='${{ secrets.CLICKHOUSE_PASSWORD }}'"
