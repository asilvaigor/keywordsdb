runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - run: pip install uv
      shell: bash
    - run: cd compute && uv sync --frozen
      shell: bash
    - run: cd compute && uv run ruff check && uv run ruff format --check --diff
      shell: bash
    - run: cd compute && uv run ty check
      shell: bash
