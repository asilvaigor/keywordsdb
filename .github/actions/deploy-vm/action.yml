inputs:
  env:
    required: true
    type: string
  name:
    required: true
    type: string
  image_name:
    required: true
    type: string
  workload_identity_provider:
    required: true
    type: string
  project_id:
    required: true
    type: string
  zone:
    required: true
    type: string
  tag:
    required: false
    type: string
    default: ""
runs:
  using: "composite"
  steps:
    - uses: "google-github-actions/auth@v2"
      with:
        project_id: ${{ inputs.project_id }}
        workload_identity_provider: ${{ inputs.WORKLOAD_IDENTITY_PROVIDER }}
    - run: |
        VM_STATUS=$(gcloud compute instances describe ${{ inputs.name }}-${{ inputs.env }} \
        --zone=${{ inputs.zone }} \
        --format="value(status)" || echo "NOT_FOUND")

        if [ "$VM_STATUS" = "RUNNING" ]; then
          gcloud compute ssh ${{ inputs.name }}-${{ inputs.env }} \
          --zone=${{ inputs.zone }} \
          --command="docker container prune -f && docker image prune -f" || echo "VM SSH failed, continuing with container update"
        fi

        gcloud compute instances update-container ${{ inputs.name }}-${{ inputs.env }} \
        --zone=${{ inputs.zone }} \
        --container-image=us-central1-docker.pkg.dev/${{ inputs.project_id }}/keywordsdb/${{ inputs.image_name }}:${{ inputs.tag != '' && inputs.tag || inputs.env }}
      shell: bash
