inputs:
  env:
    required: true
    type: string
  name:
    required: true
    type: string
  image_name:
    required: true
    type: string
  workload_identity_provider:
    required: true
    type: string
  project_id:
    required: true
    type: string
  zone:
    required: true
    type: string
  tag:
    required: false
    type: string
    default: "keep"
runs:
  using: "composite"
  steps:
    - uses: "google-github-actions/auth@v2"
      with:
        project_id: ${{ inputs.project_id }}
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
    - run: |
        gcloud compute instance-groups managed rolling-action restart ${{ inputs.name }}-${{ inputs.env }}-igm \
          --zone=${{ inputs.zone }} \
          --max-unavailable=1
      shell: bash
