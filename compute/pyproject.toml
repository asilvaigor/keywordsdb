[project]
name = "keywordsdb"
version = "0.1.0"
description = "keywordsdb"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asynciolimiter>=1.2.0",
    "bingads>=13.0.27",
    "clickhouse-connect>=0.15.1",
    "fastembed>=0.8.0",
    "google-ads>=30.0.0",
    "google-ads-stubs>=25.1.0",
    "google-cloud-bigquery>=3.41.0",
    "google-cloud-firestore>=2.26.0",
    "google-cloud-secret-manager>=2.27.0",
    "google-cloud-storage>=3.10.1",
    "numpy>=2.4.4",
    "onnxruntime>=1.24.4",
    "polars[pyarrow]>=1.39.3",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.10",
    "ty>=0.0.29",
]

[tool.ruff]
format.skip-magic-trailing-comma = true
line-length = 120
lint.isort.split-on-trailing-comma = false
lint.select = ["E", "F", "W", "I", "N", "ANN", "UP"]
