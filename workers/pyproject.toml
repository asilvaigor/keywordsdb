[project]
name = "keywordsdb"
version = "0.1.0"
description = "keywordsdb"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asynciolimiter>=1.2.0",
    "bingads>=13.0.26",
    "clickhouse-connect>=0.10.0",
    "google-ads>=28.4.1",
    "google-ads-stubs>=24.0.0",
    "google-cloud-bigquery>=3.40.0",
    "google-cloud-firestore>=2.23.0",
    "google-cloud-secret-manager>=2.25.0",
    "google-cloud-storage>=3.8.0",
    "numpy>=2.4.1",
    "polars[pyarrow]>=1.37.1",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "python-dotenv>=1.2.1",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[tool.ruff]
format.skip-magic-trailing-comma = true
line-length = 120
lint.isort.split-on-trailing-comma = false
lint.select = ["E", "F", "W", "I", "N", "ANN", "UP"]
