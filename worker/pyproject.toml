[project]
name = "keywordsdb"
version = "0.1.0"
description = "keywordsdb"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncer>=0.0.8",
    "asynciolimiter>=1.1.1",
    "google-ads>=25.1.0",
    "google-ads-stubs>=20.0.0",
    "google-cloud-bigquery>=3.29.0",
    "google-cloud-secret-manager>=2.23.0",
    "google-cloud-storage>=3.0.0",
    "numpy>=2.2.3",
    "polars[pyarrow]>=1.22.0",
    "structlog>=25.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "mypy>=1.15.0",
    "python-dotenv>=1.0.1",
    "ruff>=0.9.6",
]

[tool.ruff]
format.skip-magic-trailing-comma = true
line-length = 120
lint.isort.split-on-trailing-comma = false
lint.select = ["E", "F", "W", "I", "N"]

[tool.mypy]
allow_redefinition = true
pretty = true
strict = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["ratelimit", "google.cloud.storage"]
